<!doctype html>
<html lang="be">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f1ea">
<title>Афіша</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎟️</text></svg>">
<style>
:root{
  --bg:#f6f1ea; --card:#fffdf9; --ink:#2a2420; --muted:#8a7f76; --line:#e8dfd4;
  --accent:#d9572b; --accent-ink:#fff; --soft:#f3e6dc; --going:#2f8f5b; --going-soft:#e2f2e8;
  --shadow:0 1px 2px rgba(60,40,20,.06),0 4px 14px rgba(60,40,20,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1b1816; --card:#26221f; --ink:#f1ebe4; --muted:#a39890; --line:#3a332e;
    --accent:#ef7a4f; --accent-ink:#1b1816; --soft:#352b25; --going:#5cc48a; --going-soft:#22352a;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#1b1816; --card:#26221f; --ink:#f1ebe4; --muted:#a39890; --line:#3a332e;
  --accent:#ef7a4f; --accent-ink:#1b1816; --soft:#352b25; --going:#5cc48a; --going-soft:#22352a;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 80px}
header{display:flex;align-items:center;gap:10px;margin:4px 0 14px}
h1{font-size:26px;margin:0;letter-spacing:-.5px;flex:1}
.iconbtn{border:0;background:var(--card);color:var(--ink);width:38px;height:38px;border-radius:12px;font-size:17px;box-shadow:var(--shadow);cursor:pointer;display:grid;place-items:center}
.lang{font-size:13px;font-weight:600;width:auto;padding:0 10px}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--line);display:inline-block}
.sync-dot.ok{background:var(--going)} .sync-dot.busy{background:#e0a33a} .sync-dot.err{background:#d23}

.add{display:flex;gap:8px;background:var(--card);padding:8px;border-radius:16px;box-shadow:var(--shadow);margin-bottom:18px}
.add input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font-size:16px;padding:8px}
.add input:focus{outline:none}
.btn{border:0;border-radius:12px;padding:10px 14px;font-size:15px;font-weight:600;cursor:pointer;background:var(--soft);color:var(--ink);text-decoration:none;display:inline-block}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--muted)}
.btn.small{padding:7px 10px;font-size:13px;border-radius:10px}

.section-title{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 4px 8px;display:flex;justify-content:space-between;align-items:center}
.month{font-size:13px;font-weight:700;color:var(--accent);margin:14px 4px 6px}
.empty{color:var(--muted);text-align:center;padding:28px 12px;font-size:15px}

.card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:12px;margin-bottom:10px;display:flex;gap:12px}
.card.going{outline:2px solid var(--going)}
.date{flex:none;width:52px;text-align:center;border-radius:12px;background:var(--soft);padding:6px 0;align-self:flex-start}
.date .d{font-size:22px;font-weight:700;line-height:1.1}
.date .m{font-size:11px;text-transform:uppercase;color:var(--muted)}
.date .w{font-size:11px;color:var(--muted)}
.date.none{display:grid;place-items:center;height:52px;font-size:22px}
.body{flex:1;min-width:0}
.title{font-weight:650;font-size:16px;word-wrap:break-word}
.meta{font-size:13px;color:var(--muted);margin-top:2px;display:flex;flex-wrap:wrap;gap:4px 10px}
.src{display:inline-flex;align-items:center;gap:4px;color:var(--muted);text-decoration:none;font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.src:hover{color:var(--accent)}
.note{font-size:14px;margin-top:6px;white-space:pre-wrap;word-wrap:break-word}
.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.actions .btn{padding:7px 10px;font-size:13px;border-radius:10px}
.going-btn.on{background:var(--going-soft);color:var(--going)}
.cal-menu{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.past .card{opacity:.6}

/* sheet */
.overlay{position:fixed;inset:0;background:rgba(20,12,6,.45);display:none;align-items:flex-end;justify-content:center;z-index:10}
.overlay.open{display:flex}
.sheet{background:var(--bg);width:100%;max-width:640px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
@media(min-width:700px){.overlay{align-items:center}.sheet{border-radius:20px}}
.sheet h2{margin:0 0 12px;font-size:19px}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
.field{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:11px 12px;font-size:16px;font-family:inherit}
.field:focus{outline:2px solid var(--accent);border-color:transparent}
textarea.field{min-height:70px;resize:vertical}
.row{display:flex;gap:8px}.row>div{flex:1;min-width:0}
.sheet-actions{display:flex;gap:8px;margin-top:16px}
.sheet-actions .spacer{flex:1}
.hint{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.45}
.hint code{background:var(--soft);padding:1px 5px;border-radius:5px;font-size:12px;word-break:break-all}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🎟️ <span data-t="appName"></span></h1>
    <button class="iconbtn lang" id="langBtn"></button>
    <button class="iconbtn" id="syncBtn" title="Sync"><span class="sync-dot" id="syncDot"></span></button>
  </header>

  <form class="add" id="quickAdd">
    <input id="quickInput" autocomplete="off" enterkeyhint="go">
    <button type="button" class="btn" id="pasteBtn" title="Paste">📋</button>
    <button class="btn primary" type="submit">+</button>
  </form>

  <div id="list"></div>
</div>

<!-- edit sheet -->
<div class="overlay" id="editOv">
  <form class="sheet" id="editForm">
    <h2 id="editTitle"></h2>
    <label data-t="fLink"></label>
    <input class="field" id="fUrl" inputmode="url" autocomplete="off">
    <label data-t="fTitle"></label>
    <input class="field" id="fTitle" autocomplete="off">
    <div class="row">
      <div><label data-t="fDate"></label><input class="field" type="date" id="fDate"></div>
      <div><label data-t="fTime"></label><input class="field" type="time" id="fTime"></div>
    </div>
    <label data-t="fPlace"></label>
    <input class="field" id="fPlace" autocomplete="off">
    <label data-t="fNote"></label>
    <textarea class="field" id="fNote"></textarea>
    <div class="sheet-actions">
      <button type="button" class="btn ghost" id="delBtn" data-t="delete"></button>
      <span class="spacer"></span>
      <button type="button" class="btn" id="cancelBtn" data-t="cancel"></button>
      <button type="submit" class="btn primary" data-t="save"></button>
    </div>
  </form>
</div>

<!-- sync sheet -->
<div class="overlay" id="syncOv">
  <form class="sheet" id="syncForm">
    <h2 data-t="syncTitle"></h2>
    <label>GitHub token (gist)</label>
    <input class="field" id="sToken" autocomplete="off" placeholder="ghp_…">
    <label>Gist ID</label>
    <input class="field" id="sGist" autocomplete="off" data-tp="gistPh">
    <p class="hint" data-t="syncHint"></p>
    <p class="hint" id="syncStatus"></p>
    <label data-t="backup"></label>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button type="button" class="btn small" id="exportBtn" data-t="exportBtn"></button>
      <button type="button" class="btn small" id="importBtn" data-t="importBtn"></button>
      <input type="file" id="importFile" accept=".json,application/json" hidden>
    </div>
    <p class="hint" data-t="backupHint"></p>
    <div class="sheet-actions">
      <button type="button" class="btn small" id="copyLinkBtn" data-t="copyLink"></button>
      <span class="spacer"></span>
      <button type="button" class="btn" id="syncCancel" data-t="close"></button>
      <button type="submit" class="btn primary" data-t="save"></button>
    </div>
  </form>
</div>

<div class="toast" id="toast"></div>

<script>
/* ---------- i18n ---------- */
const I18N = {
  be:{
    appName:'Афіша', quickPh:'Устаў спасылку ці тэкст пра івент…',
    upcoming:'Наперадзе', nodate:'Без даты', past:'Мінулыя', show:'паказаць', hide:'схаваць',
    empty:'Пакуль пуста. Скінь сюды спасылку на нейкі івент 🙂',
    newEvent:'Новы івент', editEvent:'Рэдагаваць',
    fLink:'Спасылка', fTitle:'Назва', fDate:'Дата', fTime:'Час', fPlace:'Месца', fNote:'Нататка',
    save:'Захаваць', cancel:'Адмена', delete:'Выдаліць', close:'Закрыць',
    open:'Адкрыць', toCal:'📅 У каляндар', addDate:'📅 Дадаць дату', going:'Ідзём', goingOn:'✓ Ідзём', edit:'✎',
    google:'Google', apple:'Apple / .ics',
    confirmDel:'Выдаліць гэты івент?', saved:'Захавана', deleted:'Выдалена',
    syncTitle:'Налады',
    backup:'Рэзервовая копія', exportBtn:'⬇️ Экспарт', importBtn:'⬆️ Імпарт', backupHint:'Экспарт спампуе ўсе івенты ў .json. Імпарт дадае івенты з файла да існуючых, нічога не сцірае.', imported:'Імпартавана івентаў: ', importErr:'Не атрымалася прачытаць файл', gistPh:'пуста = стварыць новы',
    syncHint:'Тое самае, што ў Шуфлядцы: токен з правам <code>gist</code>. Калі Gist ID пусты, створыцца новы сакрэтны gist. На другім тэлефоне проста адкрый спасылку з кнопкі ніжэй.',
    copyLink:'🔗 Спасылка для другога тэлефона', linkCopied:'Спасылка скапіявана',
    syncOk:'Сінхранізавана', syncErr:'Памылка сінхранізацыі', syncOff:'Сінхранізацыя не наладжана',
    pasteFail:'Не атрымалася ўставіць, устаў рукамі',
    months:['студзень','люты','сакавік','красавік','травень','чэрвень','ліпень','жнівень','верасень','кастрычнік','лістапад','снежань'],
    mShort:['сту','лют','сак','кра','тра','чэр','ліп','жні','вер','кас','ліс','сне'],
    days:['нд','пн','аў','ср','чц','пт','сб'], today:'сёння', tomorrow:'заўтра',
    igPost:'Пост у Instagram', igReel:'Рылс у Instagram'
  },
  uk:{
    appName:'Афіша', quickPh:'Встав посилання або текст про івент…',
    upcoming:'Попереду', nodate:'Без дати', past:'Минулі', show:'показати', hide:'сховати',
    empty:'Поки порожньо. Скинь сюди посилання на якийсь івент 🙂',
    newEvent:'Новий івент', editEvent:'Редагувати',
    fLink:'Посилання', fTitle:'Назва', fDate:'Дата', fTime:'Час', fPlace:'Місце', fNote:'Нотатка',
    save:'Зберегти', cancel:'Скасувати', delete:'Видалити', close:'Закрити',
    open:'Відкрити', toCal:'📅 У календар', addDate:'📅 Додати дату', going:'Йдемо', goingOn:'✓ Йдемо', edit:'✎',
    google:'Google', apple:'Apple / .ics',
    confirmDel:'Видалити цей івент?', saved:'Збережено', deleted:'Видалено',
    syncTitle:'Налаштування',
    backup:'Резервна копія', exportBtn:'⬇️ Експорт', importBtn:'⬆️ Імпорт', backupHint:'Експорт завантажить усі івенти в .json. Імпорт додає івенти з файлу до наявних, нічого не стирає.', imported:'Імпортовано івентів: ', importErr:'Не вдалося прочитати файл', gistPh:'порожньо = створити новий',
    syncHint:'Те саме, що в Шуфлядці: токен з правом <code>gist</code>. Якщо Gist ID порожній, створиться новий секретний gist. На другому телефоні просто відкрий посилання з кнопки нижче.',
    copyLink:'🔗 Посилання для другого телефона', linkCopied:'Посилання скопійовано',
    syncOk:'Синхронізовано', syncErr:'Помилка синхронізації', syncOff:'Синхронізацію не налаштовано',
    pasteFail:'Не вдалося вставити, встав вручну',
    months:['січень','лютий','березень','квітень','травень','червень','липень','серпень','вересень','жовтень','листопад','грудень'],
    mShort:['січ','лют','бер','кві','тра','чер','лип','сер','вер','жов','лис','гру'],
    days:['нд','пн','вт','ср','чт','пт','сб'], today:'сьогодні', tomorrow:'завтра',
    igPost:'Пост в Instagram', igReel:'Рілс в Instagram'
  }
};
const store = {
  get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
let lang = store.get('afisha.lang','be');
const t = k => I18N[lang][k] ?? k;

/* ---------- state ---------- */
let events = store.get('afisha.events', []);
let showPast = false;
let calOpenId = null;
const $ = id => document.getElementById(id);
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const now = () => Date.now();

function persist(){ store.set('afisha.events', events); schedulePush(); }

/* ---------- parsing ---------- */
const MONTH_WORDS = {
  // cz (genitive + nominative), en, be, uk, ru
  ledna:1,leden:1,února:2,unora:2,únor:2,března:3,brezna:3,dubna:4,duben:4,května:5,kvetna:5,června:6,cervna:6,července:7,cervence:7,srpna:8,září:9,zari:9,října:10,rijna:10,listopadu:11,prosince:12,
  jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,sept:9,oct:10,nov:11,dec:12,
  january:1,february:2,march:3,april:4,june:6,july:7,august:8,september:9,october:10,november:11,december:12,
  студзеня:1,лютага:2,сакавіка:3,красавіка:4,траўня:5,чэрвеня:6,ліпеня:7,жніўня:8,верасня:9,кастрычніка:10,лістапада:11,снежня:12,
  січня:1,лютого:2,березня:3,квітня:4,травня:5,червня:6,липня:7,серпня:8,вересня:9,жовтня:10,листопада:11,грудня:12,
  января:1,февраля:2,марта:3,апреля:4,мая:5,июня:6,июля:7,августа:8,сентября:9,октября:10,ноября:11,декабря:12
};
const pad = n => String(n).padStart(2,'0');
function ymd(y,m,d){ return `${y}-${pad(m)}-${pad(d)}`; }
function validDate(y,m,d){ const dt=new Date(y,m-1,d); return dt.getFullYear()===y && dt.getMonth()===m-1 && dt.getDate()===d; }
function guessYear(m,d){
  const today=new Date(); today.setHours(0,0,0,0);
  let y=today.getFullYear();
  if(new Date(y,m-1,d) < new Date(today.getTime()-30*864e5)) y++; // >месяц таму → наступны год
  return y;
}
function parseText(raw){
  const out = {url:'', title:'', date:'', time:'', place:''};
  const urlM = raw.match(/https?:\/\/[^\s<>"']+/i) || raw.match(/\b(?:www\.|instagram\.com|fb\.me|facebook\.com|goout\.net)[^\s<>"']*/i);
  if(urlM){ out.url = urlM[0].replace(/[),.!?]+$/,''); if(!/^https?:/i.test(out.url)) out.url='https://'+out.url; }
  const rest = raw.replace(urlM?urlM[0]:'', ' ');
  let m;
  if((m = rest.match(/\b(20\d\d)-(\d{1,2})-(\d{1,2})\b/)) && validDate(+m[1],+m[2],+m[3])) out.date=ymd(+m[1],+m[2],+m[3]);
  else if((m = rest.match(/\b(\d{1,2})\s*[.\/]\s*(\d{1,2})\s*[.\/]\s*(20\d\d|\d\d)\b/))){
    let y=+m[3]; if(y<100) y+=2000;
    if(validDate(y,+m[2],+m[1])) out.date=ymd(y,+m[2],+m[1]);
  }
  if(!out.date && (m = rest.match(/(?:^|[^\d:])(\d{1,2})\s*\.\s*(\d{1,2})\s*\.?(?![\d:])/))){
    const d=+m[1], mo=+m[2];
    if(mo>=1&&mo<=12&&d>=1&&d<=31){ const y=guessYear(mo,d); if(validDate(y,mo,d)) out.date=ymd(y,mo,d); }
  }
  if(!out.date){
    const re = /(\d{1,2})\.?\s+([a-zA-Zа-яА-ЯіІўЎєЄїЇáéíóúůýčďěňřšťžÁČŘŠŽ]+)\.?(?:\s+(20\d\d))?/g;
    while((m = re.exec(rest))){
      const mo = MONTH_WORDS[m[2].toLowerCase()];
      if(mo){ const d=+m[1]; const y=m[3]?+m[3]:guessYear(mo,d); if(validDate(y,mo,d)){ out.date=ymd(y,mo,d); break; } }
    }
  }
  if((m = rest.match(/\b([01]?\d|2[0-3]):([0-5]\d)\b/))) out.time = pad(+m[1])+':'+m[2];
  const text = rest
    .replace(/\b20\d\d-\d{1,2}-\d{1,2}\b/g,' ')
    .replace(/\b\d{1,2}\s*[.\/]\s*\d{1,2}\s*[.\/]?\s*(20\d\d)?(?![\d:])/g,' ')
    .replace(/(\d{1,2})\.?\s+([^\s\d.,]+)\.?(\s+20\d\d)?/g,(w,d,mo)=>MONTH_WORDS[mo.toLowerCase()]?' ':w)
    .replace(/\b(ve|at|в|у|о|a|o)?\s*([01]?\d|2[0-3]):[0-5]\d\s*(h|hod)?\b/gi,' ')
    .replace(/\s+/g,' ').replace(/^[\s,.\-–|·]+|[\s,.\-–|·]+$/g,'').trim();
  if(text && text.length>3) out.title = text.length>90 ? text.slice(0,90)+'…' : text;
  if(!out.title && out.url) out.title = titleFromUrl(out.url);
  return out;
}
function sourceOf(url){
  try{
    const u = new URL(url); const h = u.hostname.replace(/^www\.|^m\./,'');
    if(/instagram\.com$/.test(h)) return {icon:'📸', name:'Instagram', u};
    if(/(facebook\.com|fb\.me|fb\.com)$/.test(h)) return {icon:'📘', name:'Facebook', u};
    if(/goout\.net$/.test(h)) return {icon:'🎫', name:'GoOut', u};
    if(/(ticketportal|ticketmaster|smsticket|ticketstream|eventim|tickety)/.test(h)) return {icon:'🎫', name:h, u};
    if(/(youtube\.com|youtu\.be)$/.test(h)) return {icon:'▶️', name:'YouTube', u};
    if(/(maps\.google|goo\.gl|maps\.app\.goo\.gl|mapy\.cz|mapy\.com)/.test(h)) return {icon:'📍', name:h, u};
    if(/(t\.me|telegram)/.test(h)) return {icon:'✈️', name:'Telegram', u};
    return {icon:'🔗', name:h, u};
  }catch(e){ return null; }
}
function titleFromUrl(url){
  const s = sourceOf(url); if(!s) return url;
  const parts = s.u.pathname.split('/').filter(Boolean);
  if(s.name==='Instagram'){
    if(parts[0]==='p') return t('igPost');
    if(parts[0]==='reel' || parts[0]==='reels') return t('igReel');
    if(parts[0]) return '@'+parts[0];
  }
  const cand = parts.filter(p=>!/^\d+$/.test(p) && !/^[a-z]{2}$/i.test(p));
  const last = cand.filter(p=>/[-_+]/.test(p)).sort((a,b)=>b.length-a.length)[0] || cand.pop();
  if(last){ const w = decodeURIComponent(last).replace(/\.[a-z]{2,4}$/,'').replace(/[-_+]+/g,' ').trim(); if(w.length>3 && !/^[a-z0-9]{12,}$/i.test(w)) return w.charAt(0).toUpperCase()+w.slice(1); }
  return s.name;
}

/* ---------- calendar ---------- */
function addMinutes(dateStr,timeStr,mins){
  const [y,m,d]=dateStr.split('-').map(Number); const [hh,mm]=timeStr.split(':').map(Number);
  const dt=new Date(y,m-1,d,hh,mm+mins);
  return {date:ymd(dt.getFullYear(),dt.getMonth()+1,dt.getDate()), time:pad(dt.getHours())+':'+pad(dt.getMinutes())};
}
function nextDay(dateStr){ const [y,m,d]=dateStr.split('-').map(Number); const dt=new Date(y,m-1,d+1); return ymd(dt.getFullYear(),dt.getMonth()+1,dt.getDate()); }
const compact = (d,tm) => d.replace(/-/g,'') + (tm ? 'T'+tm.replace(':','')+'00' : '');
function calDetails(e){ return [e.note, e.url].filter(Boolean).join('\n\n'); }
function googleUrl(e){
  let dates;
  if(e.time){ const end=addMinutes(e.date,e.time,120); dates=compact(e.date,e.time)+'/'+compact(end.date,end.time); }
  else dates=compact(e.date)+'/'+compact(nextDay(e.date));
  const p = new URLSearchParams({action:'TEMPLATE', text:e.title||'Event', dates, details:calDetails(e), location:e.place||'', ctz:'Europe/Prague'});
  return 'https://calendar.google.com/calendar/render?'+p.toString();
}
function icsEsc(s){ return String(s||'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;'); }
function downloadIcs(e){
  let dt;
  if(e.time){ const end=addMinutes(e.date,e.time,120);
    dt=`DTSTART;TZID=Europe/Prague:${compact(e.date,e.time)}\r\nDTEND;TZID=Europe/Prague:${compact(end.date,end.time)}`; }
  else dt=`DTSTART;VALUE=DATE:${compact(e.date)}\r\nDTEND;VALUE=DATE:${compact(nextDay(e.date))}`;
  const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Afisha//EN','CALSCALE:GREGORIAN','BEGIN:VEVENT',
    'UID:'+e.id+'@afisha','DTSTAMP:'+stamp, dt, 'SUMMARY:'+icsEsc(e.title||'Event'),
    e.place?'LOCATION:'+icsEsc(e.place):'', 'DESCRIPTION:'+icsEsc(calDetails(e)), e.url?'URL:'+e.url:'',
    'END:VEVENT','END:VCALENDAR'].filter(Boolean).join('\r\n');
  const blob=new Blob([ics],{type:'text/calendar;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=(e.title||'event').replace(/[^\p{L}\p{N} _-]/gu,'').slice(0,40).trim()+'.ics';
  document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}

/* ---------- render ---------- */
function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function todayStr(){ const d=new Date(); return ymd(d.getFullYear(),d.getMonth()+1,d.getDate()); }
function relDay(ds){
  const tdy=todayStr(); if(ds===tdy) return t('today'); if(ds===nextDay(tdy)) return t('tomorrow'); return '';
}
function cardHtml(e){
  const s = e.url ? sourceOf(e.url) : null;
  let dateBox;
  if(e.date){ const [y,m,d]=e.date.split('-').map(Number); const wd=new Date(y,m-1,d).getDay();
    dateBox=`<div class="date"><div class="m">${t('mShort')[m-1]}</div><div class="d">${d}</div><div class="w">${t('days')[wd]}</div></div>`;
  } else dateBox=`<div class="date none">${s?s.icon:'✨'}</div>`;
  const meta=[];
  if(e.date){ const r=relDay(e.date); if(r) meta.push(`<b style="color:var(--accent)">${r}</b>`); }
  if(e.time) meta.push('🕒 '+esc(e.time));
  if(e.place) meta.push('📍 '+esc(e.place));
  const calBtn = e.date
    ? `<button class="btn" data-act="cal">${t('toCal')}</button>`
    : `<button class="btn" data-act="edit" data-focus="date">${t('addDate')}</button>`;
  const calMenu = (calOpenId===e.id && e.date) ? `<div class="cal-menu">
      <a class="btn small primary" href="${esc(googleUrl(e))}" target="_blank" rel="noopener">${t('google')}</a>
      <button class="btn small primary" data-act="ics">${t('apple')}</button></div>` : '';
  return `<div class="card ${e.going?'going':''}" data-id="${e.id}">
    ${dateBox}
    <div class="body">
      <div class="title">${esc(e.title || (s?s.name:'—'))}</div>
      ${meta.length?`<div class="meta">${meta.join('')}</div>`:''}
      ${s?`<a class="src" href="${esc(e.url)}" target="_blank" rel="noopener">${s.icon} ${esc(s.name)} ↗</a>`:''}
      ${e.note?`<div class="note">${esc(e.note)}</div>`:''}
      <div class="actions">
        ${calBtn}
        <button class="btn going-btn ${e.going?'on':''}" data-act="going">${e.going?t('goingOn'):t('going')}</button>
        <button class="btn" data-act="edit" aria-label="edit">${t('edit')}</button>
      </div>
      ${calMenu}
    </div></div>`;
}
function render(){
  document.documentElement.lang = lang==='uk'?'uk':'be';
  document.querySelectorAll('[data-t]').forEach(el=>{ el.innerHTML = t(el.dataset.t); });
  document.querySelectorAll('[data-tp]').forEach(el=>{ el.placeholder = t(el.dataset.tp); });
  $('quickInput').placeholder = t('quickPh');
  $('langBtn').textContent = lang==='be'?'BY':'UA';
  const live = events.filter(e=>!e.deleted);
  const tdy = todayStr();
  const up = live.filter(e=>e.date && e.date>=tdy).sort((a,b)=>(a.date+(a.time||'99')).localeCompare(b.date+(b.time||'99')));
  const nd = live.filter(e=>!e.date).sort((a,b)=>b.created-a.created);
  const past = live.filter(e=>e.date && e.date<tdy).sort((a,b)=>b.date.localeCompare(a.date));
  let h='';
  if(!live.length) h=`<div class="empty">${t('empty')}</div>`;
  if(up.length){
    h+=`<div class="section-title">${t('upcoming')} · ${up.length}</div>`;
    let lastM='';
    up.forEach(e=>{ const [y,m]=e.date.split('-').map(Number); const key=y+'-'+m;
      if(key!==lastM){ lastM=key; h+=`<div class="month">${t('months')[m-1]}${y!==new Date().getFullYear()?' '+y:''}</div>`; }
      h+=cardHtml(e); });
  }
  if(nd.length){ h+=`<div class="section-title">${t('nodate')} · ${nd.length}</div>`; nd.forEach(e=>h+=cardHtml(e)); }
  if(past.length){
    h+=`<div class="section-title"><span>${t('past')} · ${past.length}</span><button class="btn small ghost" data-act="togglePast">${showPast?t('hide'):t('show')}</button></div>`;
    if(showPast) h+=`<div class="past">${past.map(cardHtml).join('')}</div>`;
  }
  $('list').innerHTML=h;
}

/* ---------- edit sheet ---------- */
let editingId=null;
function openEdit(e, focus){
  editingId = e && e.id ? e.id : null;
  $('editTitle').textContent = editingId ? t('editEvent') : t('newEvent');
  $('fUrl').value=e?.url||''; $('fTitle').value=e?.title||''; $('fDate').value=e?.date||'';
  $('fTime').value=e?.time||''; $('fPlace').value=e?.place||''; $('fNote').value=e?.note||'';
  $('delBtn').style.visibility = editingId?'visible':'hidden';
  $('editOv').classList.add('open');
  setTimeout(()=>{ (focus==='date'?$('fDate'):$('fTitle')).focus(); },50);
}
function closeEdit(){ $('editOv').classList.remove('open'); editingId=null; }
$('editForm').addEventListener('submit',ev=>{
  ev.preventDefault();
  let url=$('fUrl').value.trim(); if(url && !/^https?:\/\//i.test(url) && /\./.test(url)) url='https://'+url;
  const data={url, title:$('fTitle').value.trim() || (url?titleFromUrl(url):''), date:$('fDate').value, time:$('fTime').value,
    place:$('fPlace').value.trim(), note:$('fNote').value.trim(), updated:now()};
  if(!data.url && !data.title) return;
  if(editingId){ Object.assign(events.find(x=>x.id===editingId), data); }
  else events.push({id:uid(), created:now(), going:false, ...data});
  persist(); closeEdit(); render(); toast(t('saved'));
});
$('cancelBtn').onclick=closeEdit;
$('delBtn').onclick=()=>{
  if(!editingId || !confirm(t('confirmDel'))) return;
  const e=events.find(x=>x.id===editingId); Object.assign(e,{deleted:true,updated:now()});
  persist(); closeEdit(); render(); toast(t('deleted'));
};
$('editOv').addEventListener('click',ev=>{ if(ev.target===$('editOv')) closeEdit(); });

/* ---------- quick add ---------- */
function quickAdd(text){
  text=(text||'').trim(); if(!text) return;
  openEdit(parseText(text)); $('quickInput').value='';
}
$('quickAdd').addEventListener('submit',ev=>{ ev.preventDefault(); quickAdd($('quickInput').value); });
$('pasteBtn').onclick=async()=>{
  try{ const txt=await navigator.clipboard.readText(); if(txt) quickAdd(txt); else $('quickInput').focus(); }
  catch(e){ toast(t('pasteFail')); $('quickInput').focus(); }
};

/* ---------- list clicks ---------- */
$('list').addEventListener('click',ev=>{
  const b=ev.target.closest('[data-act]'); if(!b) return;
  if(b.dataset.act==='togglePast'){ showPast=!showPast; render(); return; }
  const id=b.closest('.card')?.dataset.id; const e=events.find(x=>x.id===id); if(!e) return;
  const act=b.dataset.act;
  if(act==='edit') openEdit(e, b.dataset.focus);
  if(act==='going'){ e.going=!e.going; e.updated=now(); persist(); render(); }
  if(act==='cal'){ calOpenId = calOpenId===id?null:id; render(); }
  if(act==='ics') downloadIcs(e);
});

$('langBtn').onclick=()=>{ lang = lang==='be'?'uk':'be'; store.set('afisha.lang',lang); render(); };

/* ---------- toast ---------- */
let toastT; function toast(msg){ const el=$('toast'); el.textContent=msg; el.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('show'),1800); }

/* ---------- gist sync ---------- */
const FILE='afisha.json';
let cfg = store.get('afisha.sync', {token:'', gist:''});
let pushT=null, syncing=false;
function setDot(state){ $('syncDot').className='sync-dot '+(state||''); }
function merge(a,b){
  const map=new Map(); [...a,...b].forEach(e=>{ const cur=map.get(e.id); if(!cur || (e.updated||0)>(cur.updated||0)) map.set(e.id,e); });
  // tombstones старэйшыя за 60 дзён можна выкінуць
  const cutoff=now()-60*864e5;
  return [...map.values()].filter(e=>!(e.deleted && (e.updated||0)<cutoff));
}
async function gh(path,opts={}){
  const r=await fetch('https://api.github.com'+path,{...opts,headers:{'Authorization':'token '+cfg.token,'Accept':'application/vnd.github+json',...(opts.body?{'Content-Type':'application/json'}:{})}});
  if(!r.ok) throw new Error(r.status+' '+(await r.text()).slice(0,120));
  return r.json();
}
async function pull(){
  if(!cfg.token||!cfg.gist) return;
  const g=await gh('/gists/'+cfg.gist);
  const f=g.files[FILE]; if(!f) return;
  let content=f.content;
  if(f.truncated){ content=await (await fetch(f.raw_url)).text(); }
  const remote=JSON.parse(content||'{}').events||[];
  events=merge(events,remote); store.set('afisha.events',events);
}
async function push(){
  if(!cfg.token||!cfg.gist) return;
  await gh('/gists/'+cfg.gist,{method:'PATCH',body:JSON.stringify({files:{[FILE]:{content:JSON.stringify({events},null,1)}}})});
}
async function sync(){
  if(!cfg.token){ setDot(''); return; }
  if(syncing) return; syncing=true; setDot('busy');
  try{
    if(!cfg.gist){
      const g=await gh('/gists',{method:'POST',body:JSON.stringify({description:'Афіша — events',public:false,files:{[FILE]:{content:JSON.stringify({events})}}})});
      cfg.gist=g.id; store.set('afisha.sync',cfg);
    } else { await pull(); await push(); }
    setDot('ok'); $('syncStatus').textContent=t('syncOk')+' · '+new Date().toLocaleTimeString().slice(0,5);
  }catch(e){ console.error(e); setDot('err'); $('syncStatus').textContent=t('syncErr')+': '+e.message; }
  syncing=false; render();
}
function schedulePush(){ if(!cfg.token) return; clearTimeout(pushT); pushT=setTimeout(sync,1200); }

$('syncBtn').onclick=()=>{ $('sToken').value=cfg.token; $('sGist').value=cfg.gist; if(!cfg.token) $('syncStatus').textContent=t('syncOff'); $('syncOv').classList.add('open'); };
$('syncCancel').onclick=()=>$('syncOv').classList.remove('open');
$('syncOv').addEventListener('click',ev=>{ if(ev.target===$('syncOv')) $('syncOv').classList.remove('open'); });
$('syncForm').addEventListener('submit',ev=>{ ev.preventDefault();
  cfg={token:$('sToken').value.trim(), gist:$('sGist').value.trim()}; store.set('afisha.sync',cfg);
  $('syncOv').classList.remove('open'); sync(); });
$('copyLinkBtn').onclick=async()=>{
  if(!cfg.token||!cfg.gist){ toast(t('syncOff')); return; }
  const link=location.origin+location.pathname+'#sync='+btoa(JSON.stringify(cfg));
  try{ await navigator.clipboard.writeText(link); toast(t('linkCopied')); }catch(e){ prompt('',link); }
};

/* ---------- export / import ---------- */
$('exportBtn').onclick=()=>{
  const data=JSON.stringify({app:'afisha',exported:new Date().toISOString(),events:events.filter(e=>!e.deleted)},null,1);
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));
  a.download='afisha-'+todayStr()+'.json'; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
};
$('importBtn').onclick=()=>$('importFile').click();
$('importFile').onchange=async ev=>{
  const f=ev.target.files[0]; ev.target.value=''; if(!f) return;
  try{
    const j=JSON.parse(await f.text());
    const list=(Array.isArray(j)?j:j.events||[]).filter(e=>e && (e.url||e.title));
    const before=new Set(events.map(e=>e.id));
    const incoming=list.map(e=>({id:e.id||uid(),url:e.url||'',title:e.title||'',date:e.date||'',time:e.time||'',place:e.place||'',note:e.note||'',going:!!e.going,created:e.created||now(),updated:e.updated||now(),...(e.deleted?{deleted:true}:{})}));
    events=merge(events,incoming); persist(); render();
    toast(t('imported')+incoming.filter(e=>!before.has(e.id)&&!e.deleted).length);
  }catch(e){ console.error(e); toast(t('importErr')); }
};

/* ---------- boot: #sync=… and ?url=/?text= (для Shortcuts / share) ---------- */
(function boot(){
  const hm=location.hash.match(/sync=([^&]+)/);
  if(hm){ try{ cfg=JSON.parse(atob(decodeURIComponent(hm[1]))); store.set('afisha.sync',cfg); }catch(e){} history.replaceState(null,'',location.pathname+location.search); }
  render();
  const q=new URLSearchParams(location.search); const shared=[q.get('title'),q.get('text'),q.get('url')].filter(Boolean).join(' ');
  if(shared){ history.replaceState(null,'',location.pathname); quickAdd(shared); }
  sync();
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') sync(); });
})();
</script>
</body>
